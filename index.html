<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Двери и Ключи: Hall of Fame</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            margin: 0; padding: 0; background-color: #0f0f13; color: #e0e0e0;
            font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column;
            align-items: center; height: 100vh; overflow: hidden; touch-action: none;
        }
        .header { text-align: center; margin-top: 10px; width: 100%; max-width: 320px; z-index: 10;}
        h1 { margin: 0; font-size: 18px; color: #00d4ff; text-transform: uppercase; text-shadow: 0 0 10px #00d4ff66; }
        
        .stats-panel {
            display: flex; justify-content: space-between; background: rgba(30, 30, 40, 0.8);
            padding: 8px; border-radius: 12px; border: 1px solid #444; margin-top: 5px; backdrop-filter: blur(5px);
        }
        .stats-col { display: flex; flex-direction: column; align-items: center; width: 25%; font-size: 11px; text-transform: uppercase; color: #888;}
        .stats-val { font-size: 14px; font-weight: bold; color: #ffd700; margin-top: 2px;}
        
        .grid-container { position: relative; margin-top: 15px; }
        .grid {
            position: relative; width: 320px; height: 320px;
            background-color: #1a1a20; border: 4px solid #333; border-radius: 12px;
            box-shadow: 0 0 40px rgba(0,0,0,0.9); overflow: hidden;
        }

        /* Кнопка Лидеров */
        .btn-leaderboard {
            margin-top: 15px; background: #333; color: #fff; border: 1px solid #555;
            padding: 8px 15px; border-radius: 20px; font-size: 12px; cursor: pointer;
            display: flex; align-items: center; gap: 5px; transition: 0.3s;
        }
        .btn-leaderboard:hover { background: #444; border-color: #00d4ff; }

        /* Таблица Лидеров (Модалка) */
        .lb-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); z-index: 300; display: none;
            flex-direction: column; align-items: center; padding-top: 40px;
        }
        .lb-box {
            width: 280px; background: #1a1a20; border-radius: 20px;
            border: 2px solid #ffd700; padding: 20px; box-shadow: 0 0 30px #ffd70033;
        }
        .lb-title { color: #ffd700; margin: 0 0 15px 0; text-align: center; font-size: 20px; }
        .lb-row {
            display: flex; justify-content: space-between; padding: 10px 5px;
            border-bottom: 1px solid #333; font-size: 14px;
        }
        .lb-row.me { background: rgba(0, 212, 255, 0.1); color: #00d4ff; font-weight: bold; }
        .lb-close { margin-top: 20px; color: #888; text-decoration: underline; cursor: pointer; }

        /* Эффекты и анимации */
        @keyframes comboPop {
            0% { transform: scale(0.4); opacity: 0; }
            20% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1.4) translateY(-100px); opacity: 0; }
        }
        .combo-text {
            position: absolute; width: 100%; text-align: center; font-weight: 900;
            font-size: 34px; z-index: 110; top: 40%; opacity: 0; pointer-events: none;
            text-shadow: 0 0 20px #000; color: #fff;
        }
        .item {
            position: absolute; width: 40px; height: 40px;
            display: flex; justify-content: center; align-items: center;
            font-size: 24px; cursor: pointer; transition: all 0.3s cubic-bezier(0.1, 0.7, 0.3, 1);
        }
        .special-rocket { text-shadow: 0 0 12px #00d4ff; }
        .special-bomb { text-shadow: 0 0 12px #ff4500; }
        .special-rainbow { filter: drop-shadow(0 0 10px #fff); animation: pulse 1s infinite; }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }
        
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); z-index: 200; display: flex;
            justify-content: center; align-items: center; opacity: 0; pointer-events: none; transition: 0.3s;
        }
        .modal-overlay.active { opacity: 1; pointer-events: all; }
        .modal-box { background: #1a1a20; padding: 25px; border-radius: 20px; text-align: center; border: 2px solid #00d4ff; width: 260px; }
        .modal-btn { background: #00d4ff; color: #000; border: none; padding: 12px 25px; font-weight: bold; border-radius: 10px; margin-top: 15px; cursor: pointer;}
    </style>
</head>
<body>

    <div class="header">
        <h1>Двери и Ключи</h1>
        <div class="stats-panel">
            <div class="stats-col">Жизни<div class="stats-val" id="ui-lives">❤️❤️❤️</div></div>
            <div class="stats-col">Уров.<div class="stats-val" id="ui-level">1</div></div>
            <div class="stats-col">Ходы<div class="stats-val" id="ui-moves">15</div></div>
            <div class="stats-col">Цель<div class="stats-val" id="ui-goal">0/0</div></div>
        </div>
    </div>
    
    <div class="grid-container">
        <div class="grid" id="grid"><div id="combo-text" class="combo-text"></div></div>
    </div>

    <button class="btn-leaderboard" onclick="openLeaderboard()">🏆 Таблица лидеров</button>

    <div id="lb-overlay" class="lb-overlay">
        <div class="lb-box">
            <h2 class="lb-title">ТОП МАСТЕРОВ</h2>
            <div id="lb-list">
                </div>
        </div>
        <div class="lb-close" onclick="closeLeaderboard()">Закрыть</div>
    </div>

    <div id="modal" class="modal-overlay">
        <div class="modal-box">
            <h2 id="modal-title" style="color:#00d4ff; margin:0;"></h2>
            <p id="modal-text"></p>
            <button id="modal-btn" class="modal-btn">ОК</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp; tg.expand();
        const grid = document.getElementById('grid'), comboTextDOM = document.getElementById('combo-text');
        const uiLives = document.getElementById('ui-lives'), uiLevel = document.getElementById('ui-level'), uiMoves = document.getElementById('ui-moves'), uiGoal = document.getElementById('ui-goal');
        const modal = document.getElementById('modal'), modalTitle = document.getElementById('modal-title'), modalText = document.getElementById('modal-text'), modalBtn = document.getElementById('modal-btn');

        const width = 8, cellSize = 40;
        let board = [], selectedItem = null, isProcessing = false;
        let currentLevel = 1, lives = 3, moves = 0, score = 0, comboChain = 0;
        let goalType = 'score', targetScore = 0, targetItem = '', targetCount = 0, currentCollected = 0;

        const items = ['🚪', '🔑', '🗝️', '🔒', '🔓', '🏛️'];
        const SPECIALS = { ROCKET: '🚀', BOMB: '💣', RAINBOW: '🌈' };

        // --- ЛИДЕРБОРД ЛОГИКА ---
        const USER_NAME = tg.initDataUnsafe?.user?.first_name || "Ты (Игрок)";
        
        function getLeaderboard() {
            // Имитация данных с сервера + твой локальный рекорд
            let myMaxLevel = localStorage.getItem('maxLevel') || 1;
            let fakeData = [
                { name: "Alex_Pro", level: 15 },
                { name: "KeyMaster", level: 12 },
                { name: "DungeonBoss", level: 9 },
                { name: "MysteryBox", level: 7 },
                { name: USER_NAME, level: parseInt(myMaxLevel), me: true }
            ];
            return fakeData.sort((a, b) => b.level - a.level);
        }

        function openLeaderboard() {
            const listDOM = document.getElementById('lb-list');
            listDOM.innerHTML = '';
            const data = getLeaderboard();
            data.forEach((player, index) => {
                const row = document.createElement('div');
                row.className = `lb-row ${player.me ? 'me' : ''}`;
                row.innerHTML = `<span>${index+1}. ${player.name}</span><span>Ур. ${player.level}</span>`;
                listDOM.appendChild(row);
            });
            document.getElementById('lb-overlay').style.display = 'flex';
        }
        function closeLeaderboard() { document.getElementById('lb-overlay').style.display = 'none'; }

        // --- ЗВУКИ ---
        let audioCtx = null;
        function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
        function playSfx(type, pitchShift = 0) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator(), g = audioCtx.createGain();
            osc.connect(g); g.connect(audioCtx.destination);
            const now = audioCtx.currentTime;
            if (type === 'match') { osc.type = 'sine'; osc.frequency.setValueAtTime(300 + pitchShift, now); g.gain.setValueAtTime(0.1, now); g.gain.linearRampToValueAtTime(0, now + 0.15); osc.start(); osc.stop(now + 0.15); }
            if (type === 'bomb') { osc.type = 'sawtooth'; osc.frequency.setValueAtTime(80, now); g.gain.setValueAtTime(0.2, now); g.gain.linearRampToValueAtTime(0, now + 0.5); osc.start(); osc.stop(now + 0.5); }
            if (type === 'rocket') { osc.type = 'square'; osc.frequency.setValueAtTime(200, now); osc.frequency.exponentialRampToValueAtTime(1200, now + 0.4); g.gain.setValueAtTime(0.05, now); g.gain.linearRampToValueAtTime(0, now + 0.4); osc.start(); osc.stop(now + 0.4); }
            if (type === 'magic') { osc.type = 'triangle'; osc.frequency.setValueAtTime(600, now); osc.frequency.linearRampToValueAtTime(1800, now + 0.5); g.gain.setValueAtTime(0.1, now); g.gain.linearRampToValueAtTime(0, now + 0.5); osc.start(); osc.stop(now + 0.5); }
        }

        // --- ИГРОВАЯ ЛОГИКА (БАЗОВАЯ) ---
        function triggerText(txt, color = "#fff") {
            comboTextDOM.innerText = txt; comboTextDOM.style.color = color;
            comboTextDOM.style.animation = 'none'; comboTextDOM.offsetHeight;
            comboTextDOM.style.animation = 'comboPop 0.8s forwards';
        }

        function updateUI() {
            uiLevel.innerText = currentLevel; uiLives.innerText = '❤️'.repeat(lives) + '🖤'.repeat(3 - lives);
            uiMoves.innerText = moves;
            uiGoal.innerText = (goalType === 'score') ? `${score}/${targetScore}` : `${targetItem}: ${currentCollected}/${targetCount}`;
        }

        function startLevel() {
            score = 0; currentCollected = 0; comboChain = 0;
            moves = 25 - Math.floor(currentLevel/2); if (moves < 12) moves = 12;
            
            // Сохраняем прогресс в localStorage
            let savedMax = localStorage.getItem('maxLevel') || 1;
            if (currentLevel > savedMax) localStorage.setItem('maxLevel', currentLevel);

            if (currentLevel % 2 !== 0) {
                goalType = 'score'; targetScore = 500 + (currentLevel * 100);
                showModal(`Этап ${currentLevel}`, `Набери ${targetScore} очков. Стань №1 в таблице!`, runGameSetup);
            } else {
                goalType = 'collect'; targetItem = items[Math.floor(Math.random() * items.length)]; targetCount = 10 + currentLevel;
                showModal(`Этап ${currentLevel}`, `Собери ${targetCount} [${targetItem}].`, runGameSetup);
            }
        }

        function runGameSetup() {
            updateUI(); grid.innerHTML = '<div id="combo-text" class="combo-text"></div>';
            board = [];
            for (let r = 0; r < width; r++) { board[r] = []; for (let c = 0; c < width; c++) addRandomItem(r, c); }
            resolveMatches(true);
        }

        function addRandomItem(r, c) { return createItem(r, c, items[Math.floor(Math.random() * items.length)]); }
        function createItem(r, c, type, special = null) {
            const dom = document.createElement('div'); dom.className = 'item';
            if (special) dom.classList.add('special-' + special.toLowerCase());
            dom.innerHTML = special ? SPECIALS[special] : type;
            grid.appendChild(dom);
            const item = { dom, type, r, c, special };
            board[r][c] = item; updateItemPos(item);
            dom.onclick = () => onItemClick(item);
            return item;
        }
        function updateItemPos(item) { item.dom.style.top = (item.r * cellSize) + 'px'; item.dom.style.left = (item.c * cellSize) + 'px'; }

        async function onItemClick(item) {
            initAudio(); if (isProcessing) return;
            if (!selectedItem) { selectedItem = item; item.dom.classList.add('selected'); playSfx('match'); } 
            else {
                const dist = Math.abs(selectedItem.r - item.r) + Math.abs(selectedItem.c - item.c);
                if (dist === 1) {
                    isProcessing = true; selectedItem.dom.classList.remove('selected');
                    await swap(selectedItem, item);
                    const matches = checkMatches();
                    if (matches.items.length > 0 || selectedItem.special || item.special) {
                        moves--; comboChain = 0; updateUI();
                        await resolveMatches(false, [{a: selectedItem, b: item}]);
                        checkLevelStatus();
                    } else { await swap(selectedItem, item); }
                    selectedItem = null; isProcessing = false;
                } else { selectedItem.dom.classList.remove('selected'); selectedItem = item; item.dom.classList.add('selected'); }
            }
        }

        function swap(i1, i2) {
            return new Promise(r => {
                const tr = i1.r, tc = i1.c; board[i1.r][i1.c] = i2; board[i2.r][i2.c] = i1;
                i1.r = i2.r; i1.c = i2.c; i2.r = tr; i2.c = tc;
                updateItemPos(i1); updateItemPos(i2); setTimeout(r, 250);
            });
        }

        function checkMatches() {
            let found = new Set(), creations = [];
            for (let r = 0; r < width; r++) {
                let line = 1;
                for (let c = 0; c < width; c++) {
                    if (c < width-1 && board[r][c].type === board[r][c+1].type && !board[r][c].special && !board[r][c+1].special) line++;
                    else {
                        if (line >= 3) {
                            for (let k=0; k<line; k++) found.add(board[r][c-k]);
                            if (line === 4) creations.push({r, c: c-Math.floor(line/2), type: 'ROCKET'});
                            if (line >= 5) creations.push({r, c: c-Math.floor(line/2), type: 'RAINBOW'});
                        }
                        line = 1;
                    }
                }
            }
            for (let c = 0; c < width; c++) {
                let line = 1;
                for (let r = 0; r < width; r++) {
                    if (r < width-1 && board[r][c].type === board[r+1][c].type && !board[r][c].special && !board[r+1][c].special) line++;
                    else {
                        if (line >= 3) {
                            for (let k=0; k<line; k++) found.add(board[r-k][c]);
                            if (line >= 4) creations.push({r: r-Math.floor(line/2), c, type: 'BOMB'});
                        }
                        line = 1;
                    }
                }
            }
            return { items: Array.from(found), creations };
        }

        async function resolveMatches(silent = false, combos = []) {
            let data = checkMatches();
            let toDestroy = new Set(data.items);
            if ((toDestroy.size > 0 || combos.length > 0) && !silent) {
                comboChain++;
                playSfx('match', comboChain * 80);
                if (comboChain === 2) triggerText("ХОРОШО!", "#00d4ff");
                else if (comboChain === 3) triggerText("ОТЛИЧНО!", "#ffd700");
                else if (comboChain >= 4) triggerText("ЛЕГЕНДАРНО!", "#ff00ff");
            }
            combos.forEach(pair => {
                const {a, b} = pair;
                if (a.special === 'RAINBOW' && b.special === 'RAINBOW') { triggerText("АННИГИЛЯЦИЯ!", "#fff"); playSfx('magic'); for(let r=0; r<width; r++) for(let c=0; c<width; c++) toDestroy.add(board[r][c]); }
                else if (a.special || b.special) {
                    [a, b].forEach(s => {
                        if (!s.special) return; toDestroy.add(s);
                        if (s.special === 'ROCKET') { playSfx('rocket'); for(let i=0; i<width; i++) { toDestroy.add(board[s.r][i]); toDestroy.add(board[i][s.c]); }}
                        else if (s.special === 'BOMB') { playSfx('bomb'); for(let dr=-1; dr<=1; dr++) for(let dc=-1; dc<=1; dc++) { let nr=s.r+dr, nc=s.c+dc; if(nr>=0 && nr<width && nc>=0 && nc<width) toDestroy.add(board[nr][nc]); }}
                        else if (s.special === 'RAINBOW') { playSfx('magic'); const other = (s === a) ? b : a; for(let r=0; r<width; r++) for(let c=0; c<width; c++) if(board[r][c].type === other.type) toDestroy.add(board[r][c]); }
                    });
                }
            });
            if (toDestroy.size === 0) return;
            if (!silent) { score += toDestroy.size * 10 * comboChain; if (goalType === 'collect') toDestroy.forEach(i => { if(i && i.type === targetItem) currentCollected++; }); updateUI(); }
            toDestroy.forEach(i => { if(i) { i.dom.style.transform = 'scale(0)'; setTimeout(() => i.dom.remove(), 250); board[i.r][i.c] = null; }});
            await new Promise(r => setTimeout(r, 250));
            if (!silent) data.creations.forEach(c => { if (board[c.r][c.c] === null) createItem(c.r, c.c, items[0], c.type); });
            for (let c = 0; c < width; c++) {
                let empty = 0;
                for (let r = width - 1; r >= 0; r--) {
                    if (board[r][c] === null) empty++;
                    else if (empty > 0) { const i = board[r][c]; board[r+empty][c] = i; board[r][c] = null; i.r += empty; updateItemPos(i); }
                }
                for (let i = 0; i < empty; i++) { const newItem = addRandomItem(i, c); newItem.dom.style.top = '-40px'; setTimeout(() => updateItemPos(newItem), 50); }
            }
            await new Promise(r => setTimeout(r, 400));
            return resolveMatches(silent);
        }

        function showModal(title, text, callback) {
            isProcessing = true; modalTitle.innerText = title; modalText.innerText = text;
            modal.classList.add('active');
            modalBtn.onclick = () => { initAudio(); modal.classList.remove('active'); isProcessing = false; callback(); };
        }

        function checkLevelStatus() {
            if ((goalType === 'score' && score >= targetScore) || (goalType === 'collect' && currentCollected >= targetCount)) {
                showModal("ПОБЕДА!", `Уровень ${currentLevel} пройден! Твой рекорд сохранен.`, () => { currentLevel++; startLevel(); });
            } else if (moves <= 0) {
                lives--;
                if (lives > 0) showModal("ХОДЫ ВЫШЛИ", `Осталось жизней: ${lives}`, startLevel);
                else showModal("КОНЕЦ ИГРЫ", "Попробуем еще раз?", () => { currentLevel=1; lives=3; startLevel(); });
            }
        }

        startLevel();
    </script>
</body>
</html>
