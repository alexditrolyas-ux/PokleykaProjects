<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Двери и Ключи</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            margin: 0; padding: 0; color: #e0e0e0;
            font-family: 'Segoe UI', Roboto, sans-serif; 
            display: flex; flex-direction: column; align-items: center; 
            height: 100vh; overflow: hidden; touch-action: none;
            background: radial-gradient(circle at top, #1a1a2e 0%, #050508 100%);
        }

        .header { text-align: center; margin-top: 15px; width: 100%; max-width: 340px; z-index: 10;}
        h1 { 
            margin: 0 0 10px 0; font-size: 22px; font-weight: 800;
            background: linear-gradient(90deg, #00d4ff, #ffd700);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            text-shadow: 0 4px 15px rgba(0, 212, 255, 0.3);
        }
        
        .stats-panel {
            display: flex; justify-content: space-between; 
            background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px);
            padding: 12px; border-radius: 16px; border: 1px solid rgba(255, 255, 255, 0.1); 
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5); margin: 0 10px;
        }
        .stats-col { display: flex; flex-direction: column; align-items: center; width: 25%; font-size: 11px; text-transform: uppercase; color: #aaa;}
        .stats-val { font-size: 16px; font-weight: bold; color: #fff; margin-top: 4px; }

        .grid-container { position: relative; margin-top: 25px; }
        .grid {
            position: relative; width: 320px; height: 320px;
            background-color: #111118;
            border-radius: 20px; border: 2px solid rgba(0, 212, 255, 0.3);
            box-shadow: 0 15px 45px rgba(0,0,0,0.8);
            overflow: visible;
        }

        #particle-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 100; }
        #combo-layer { position: absolute; width: 100%; height: 100%; top: 0; left: 0; pointer-events: none; z-index: 1000; display: flex; justify-content: center; align-items: center; }

        .combo-text {
            font-weight: 900; font-size: 34px; opacity: 0;
            text-transform: uppercase; text-align: center;
            filter: drop-shadow(0 0 15px rgba(0,0,0,0.9));
            color: #fff;
        }

        @keyframes comboPop {
            0% { transform: scale(0) rotate(-15deg); opacity: 0; }
            20% { transform: scale(1.2) rotate(10deg); opacity: 1; }
            40% { transform: scale(1) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-130px) scale(1.4); opacity: 0; }
        }

        .item {
            position: absolute; width: 40px; height: 40px;
            display: flex; justify-content: center; align-items: center;
            font-size: 26px; cursor: pointer; 
            transition: transform 0.25s cubic-bezier(0.3, 1.5, 0.6, 1), top 0.4s ease, left 0.4s ease;
            user-select: none; z-index: 10;
        }
        .item.selected { 
            transform: scale(1.2); z-index: 60; 
            background: radial-gradient(circle, rgba(0, 212, 255, 0.4) 0%, transparent 70%);
            border-radius: 50%;
        }
        .item.special-rainbow { filter: drop-shadow(0 0 8px #fff); animation: rainbowPulse 1.5s infinite alternate; }
        @keyframes rainbowPulse { from { transform: scale(1); } to { transform: scale(1.1); } }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9); backdrop-filter: blur(8px);
            z-index: 2000; display: flex; justify-content: center; align-items: center; 
            opacity: 0; pointer-events: none; transition: 0.3s;
        }
        .modal-overlay.active { opacity: 1; pointer-events: all; }
        .modal-box { 
            background: #1a1a2e; border-radius: 24px; text-align: center; 
            border: 1px solid #00d4ff; width: 280px; padding: 30px 20px;
        }
        .modal-btn { 
            background: linear-gradient(90deg, #00d4ff, #0077ff); color: #fff; 
            border: none; padding: 14px 0; width: 100%; font-weight: bold; border-radius: 12px; cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Двери и Ключи</h1>
        <div class="stats-panel">
            <div class="stats-col">Жизни<div class="stats-val" id="ui-lives">❤️❤️❤️</div></div>
            <div class="stats-col">Уров.<div class="stats-val" id="ui-level">1</div></div>
            <div class="stats-col">Ходы<div class="stats-val" id="ui-moves">15</div></div>
            <div class="stats-col">Цель<div class="stats-val" id="ui-goal">0/0</div></div>
        </div>
    </div>
    
    <div class="grid-container">
        <div class="grid" id="grid">
            <canvas id="particle-canvas"></canvas>
            <div id="combo-layer"><div id="combo-text" class="combo-text"></div></div>
        </div>
    </div>

    <div id="modal" class="modal-overlay">
        <div class="modal-box">
            <h2 id="modal-title" style="color:#00d4ff; margin:0;"></h2>
            <p id="modal-text" style="color:#aaa; margin:15px 0 25px 0;"></p>
            <button id="modal-btn" class="modal-btn">ИГРАТЬ</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp; tg.expand();
        const grid = document.getElementById('grid'), comboTextDOM = document.getElementById('combo-text');
        const canvas = document.getElementById('particle-canvas'), ctx = canvas.getContext('2d');
        const uiLives = document.getElementById('ui-lives'), uiLevel = document.getElementById('ui-level'), uiMoves = document.getElementById('ui-moves'), uiGoal = document.getElementById('ui-goal');
        const modal = document.getElementById('modal'), modalTitle = document.getElementById('modal-title'), modalText = document.getElementById('modal-text'), modalBtn = document.getElementById('modal-btn');

        const width = 8, cellSize = 40;
        let board = [], selectedItem = null, isProcessing = false;
        let currentLevel = 1, lives = 3, moves = 0, score = 0, comboChain = 0;
        let goalType = 'score', targetScore = 0, targetItem = '', targetCount = 0, currentCollected = 0;

        const items = ['🚪', '🔑', '🗝️', '🔒', '🔨', '🏠']; 
        const SPECIALS = { ROCKET: '🚀', BOMB: '💣', RAINBOW: '🌈' };

        let audioCtx = null;
        function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); if(audioCtx.state === 'suspended') audioCtx.resume(); }
        
        function playSfx(type) {
            if (!audioCtx) return;
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator(), g = audioCtx.createGain();
            osc.connect(g); g.connect(audioCtx.destination);
            if (type === 'match') { osc.frequency.setValueAtTime(440, now); g.gain.setValueAtTime(0.1, now); g.gain.exponentialRampToValueAtTime(0.01, now + 0.1); osc.start(); osc.stop(now + 0.1); }
            else if (type === 'rocket') { osc.type = 'square'; osc.frequency.setValueAtTime(100, now); osc.frequency.exponentialRampToValueAtTime(1000, now + 0.4); g.gain.setValueAtTime(0.05, now); g.gain.linearRampToValueAtTime(0, now + 0.4); osc.start(); osc.stop(now + 0.4); }
            else if (type === 'bomb') { osc.type = 'sawtooth'; osc.frequency.setValueAtTime(80, now); g.gain.setValueAtTime(0.2, now); g.gain.linearRampToValueAtTime(0, now + 0.5); osc.start(); osc.stop(now + 0.5); }
            else if (type === 'rainbow') { osc.type = 'triangle'; osc.frequency.setValueAtTime(800, now); osc.frequency.linearRampToValueAtTime(1200, now + 0.6); g.gain.setValueAtTime(0.1, now); g.gain.linearRampToValueAtTime(0, now + 0.6); osc.start(); osc.stop(now + 0.6); }
            else if (type === 'shuffle') { osc.type = 'triangle'; osc.frequency.setValueAtTime(600, now); osc.frequency.exponentialRampToValueAtTime(200, now + 0.5); g.gain.setValueAtTime(0.1, now); g.gain.linearRampToValueAtTime(0, now + 0.5); osc.start(); osc.stop(now + 0.5); }
        }

        function playComboSfx(chain) {
            if (!audioCtx) return;
            const now = audioCtx.currentTime;
            const baseFreq = 440 + ((chain - 1) * 110);
            const osc = audioCtx.createOscillator(), g = audioCtx.createGain();
            osc.connect(g); g.connect(audioCtx.destination);
            osc.frequency.setValueAtTime(baseFreq, now);
            g.gain.setValueAtTime(0.1, now);
            g.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
            osc.start(); osc.stop(now + 0.2);
        }

        let particles = [];
        function initCanvas() { canvas.width = 320; canvas.height = 320; }
        class Particle {
            constructor(x, y, color) {
                this.x = x; this.y = y; this.color = color;
                this.size = Math.random() * 4 + 2;
                this.speedX = (Math.random() - 0.5) * 6;
                this.speedY = (Math.random() - 0.5) * 6;
                this.gravity = 0.1; this.alpha = 1;
                this.decay = Math.random() * 0.02 + 0.015;
            }
            update() { this.x += this.speedX; this.y += this.speedY; this.speedY += this.gravity; this.alpha -= this.decay; if (this.size > 0.1) this.size -= 0.05; }
            draw() { ctx.save(); ctx.globalAlpha = this.alpha; ctx.fillStyle = this.color; ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill(); ctx.restore(); }
        }
        function spawnParticles(x, y, color = '#00d4ff') { for (let i = 0; i < 12; i++) particles.push(new Particle(x, y, color)); }
        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < particles.length; i++) {
                particles[i].update(); particles[i].draw();
                if (particles[i].alpha <= 0) { particles.splice(i, 1); i--; }
            }
            requestAnimationFrame(animateParticles);
        }

        function triggerText(txt, color = "#fff") {
            comboTextDOM.innerText = txt; comboTextDOM.style.color = color;
            comboTextDOM.style.textShadow = `0 0 20px ${color}`;
            comboTextDOM.style.animation = 'none'; comboTextDOM.offsetHeight; 
            comboTextDOM.style.animation = 'comboPop 1.2s cubic-bezier(0.17, 0.89, 0.32, 1.28) forwards';
        }

        function updateUI() {
            uiLevel.innerText = currentLevel; uiLives.innerText = '❤️'.repeat(lives) + '🖤'.repeat(3 - lives);
            uiMoves.innerText = moves;
            uiGoal.innerText = (goalType === 'score') ? `${score}/${targetScore}` : `${targetItem}: ${currentCollected}/${targetCount}`;
        }

        function startLevel() {
            score = 0; currentCollected = 0; comboChain = 0;
            moves = 25 - Math.floor(currentLevel/2); if (moves < 12) moves = 12;
            goalType = (currentLevel % 2 !== 0) ? 'score' : 'collect';
            targetScore = 500 + (currentLevel * 100); targetItem = items[Math.floor(Math.random() * items.length)]; targetCount = 10 + currentLevel;
            showModal(`УРОВЕНЬ ${currentLevel}`, goalType==='score' ? `Набери ${targetScore} очков` : `Собери ${targetCount} ${targetItem}`, runGameSetup);
        }

        function runGameSetup() {
            updateUI(); 
            Array.from(grid.children).forEach(child => { if(child.id !== 'combo-layer' && child.id !== 'particle-canvas') child.remove(); });
            board = [];
            for (let r = 0; r < width; r++) { board[r] = []; for (let c = 0; c < width; c++) addRandomItem(r, c); }
            resolveMatches(true);
        }

        function addRandomItem(r, c) { return createItem(r, c, items[Math.floor(Math.random() * items.length)]); }
        function createItem(r, c, type, special = null) {
            const dom = document.createElement('div'); dom.className = 'item';
            if (special) dom.classList.add('special-' + special.toLowerCase());
            dom.innerHTML = special ? SPECIALS[special] : type;
            grid.appendChild(dom);
            const item = { dom, type, r, c, special };
            board[r][c] = item; updateItemPos(item);
            dom.onclick = () => onItemClick(item);
            return item;
        }
        function updateItemPos(item) { item.dom.style.top = (item.r * cellSize) + 'px'; item.dom.style.left = (item.c * cellSize) + 'px'; }

        async function onItemClick(item) {
            initAudio(); if (isProcessing) return;
            if (!selectedItem) { selectedItem = item; item.dom.classList.add('selected'); } 
            else {
                const dist = Math.abs(selectedItem.r - item.r) + Math.abs(selectedItem.c - item.c);
                if (dist === 1) {
                    isProcessing = true; selectedItem.dom.classList.remove('selected');
                    if (selectedItem.special === 'RAINBOW' || item.special === 'RAINBOW') {
                        let rainbow = selectedItem.special === 'RAINBOW' ? selectedItem : item;
                        let target = rainbow === selectedItem ? item : selectedItem;
                        moves--; updateUI(); await activateRainbow(rainbow, target.type);
                        selectedItem = null; isProcessing = false; checkLevelStatus(); return;
                    }
                    await swap(selectedItem, item);
                    const matches = checkMatches();
                    if (matches.items.length > 0 || selectedItem.special || item.special) {
                        moves--; comboChain = 0; updateUI();
                        await resolveMatches(false, [{a: selectedItem, b: item}]);
                        checkLevelStatus();
                    } else { await swap(selectedItem, item); }
                    selectedItem = null; isProcessing = false;
                } else { selectedItem.dom.classList.remove('selected'); selectedItem = item; item.dom.classList.add('selected'); }
            }
        }

        async function activateRainbow(rainbow, targetType) {
            playSfx('rainbow'); triggerText("РАДУГА!", "#ffd700");
            let toDestroy = new Set(); toDestroy.add(rainbow);
            for(let r=0; r<width; r++) for(let c=0; c<width; c++) if(board[r][c] && board[r][c].type === targetType) toDestroy.add(board[r][c]);
            await destroyAndRefill(toDestroy);
        }

        function swap(i1, i2) {
            return new Promise(r => {
                const tr = i1.r, tc = i1.c; board[i1.r][i1.c] = i2; board[i2.r][i2.c] = i1;
                i1.r = i2.r; i1.c = i2.c; i2.r = tr; i2.c = tc;
                updateItemPos(i1); updateItemPos(i2); setTimeout(r, 250);
            });
        }

        function checkMatches() {
            let horizontalMatches = [], verticalMatches = [];
            let toDestroy = new Set(), creations = [];
            for (let r = 0; r < width; r++) {
                let match = [board[r][0]];
                for (let c = 1; c < width; c++) {
                    if (board[r][c].type === board[r][c-1].type && !board[r][c].special && !board[r][c-1].special) match.push(board[r][c]);
                    else { if (match.length >= 3) horizontalMatches.push(match); match = [board[r][c]]; }
                }
                if (match.length >= 3) horizontalMatches.push(match);
            }
            for (let c = 0; c < width; c++) {
                let match = [board[0][c]];
                for (let r = 1; r < width; r++) {
                    if (board[r][c].type === board[r-1][c].type && !board[r][c].special && !board[r-1][c].special) match.push(board[r][c]);
                    else { if (match.length >= 3) verticalMatches.push(match); match = [board[r][c]]; }
                }
                if (match.length >= 3) verticalMatches.push(match);
            }
            horizontalMatches.forEach(hList => {
                hList.forEach(item => {
                    let vList = verticalMatches.find(v => v.includes(item));
                    if (vList) { creations.push({r: item.r, c: item.c, type: 'BOMB'}); hList.forEach(i => toDestroy.add(i)); vList.forEach(i => toDestroy.add(i)); }
                });
            });
            horizontalMatches.concat(verticalMatches).forEach(list => {
                if (list.length >= 5) creations.push({r: list[2].r, c: list[2].c, type: 'RAINBOW'});
                else if (list.length === 4) creations.push({r: list[1].r, c: list[1].c, type: 'ROCKET'});
                list.forEach(i => toDestroy.add(i));
            });
            return { items: Array.from(toDestroy), creations };
        }

        async function resolveMatches(silent = false, lastSwapped = []) {
            let data = checkMatches();
            let toDestroy = new Set(data.items);
            
            lastSwapped.forEach(pair => {
                [pair.a, pair.b].forEach(s => {
                    if (!s.special) return; toDestroy.add(s);
                    if (s.special === 'BOMB') { playSfx('bomb'); for(let dr=-2; dr<=2; dr++) for(let dc=-2; dc<=2; dc++) { let nr=s.r+dr, nc=s.c+dc; if(nr>=0 && nr<width && nc>=0 && nc<width) toDestroy.add(board[nr][nc]); }}
                    if (s.special === 'ROCKET') { playSfx('rocket'); for(let i=0; i<width; i++){ toDestroy.add(board[s.r][i]); toDestroy.add(board[i][s.c]); }}
                });
            });

            if (toDestroy.size === 0) {
                if (!silent && !hasValidMoves()) { isProcessing = true; await shuffleBoard(); isProcessing = false; }
                return;
            }

            if (!silent) {
                comboChain++;
                
                // Звук срабатывает ТОЛЬКО при нахождении ряда
                if (comboChain === 1) playSfx('match');
                else { playComboSfx(comboChain); }

                if (comboChain === 2) triggerText("ХОРОШО!", "#00d4ff");
                else if (comboChain === 3) triggerText("ОТЛИЧНО!", "#ffd700");
                else if (comboChain === 4) triggerText("НЕВЕРОЯТНО!", "#ff00ff");
                else if (comboChain >= 5) triggerText("ЛЕГЕНДАРНО!", "#ffffff");
                
                score += toDestroy.size * 10 * comboChain;
                if(goalType==='collect') toDestroy.forEach(i => {if(i && i.type===targetItem) currentCollected++;});
                updateUI();
            }

            await destroyAndRefill(toDestroy, data.creations);
            return resolveMatches(silent);
        }

        async function destroyAndRefill(toDestroy, creations = []) {
            toDestroy.forEach(i => { if(i && board[i.r][i.c]) { spawnParticles(i.c*40+20, i.r*40+20, i.special ? '#ffd700' : '#00d4ff'); i.dom.style.transform = 'scale(0)'; setTimeout(() => i.dom.remove(), 250); board[i.r][i.c] = null; } });
            await new Promise(r => setTimeout(r, 250));
            creations.forEach(c => { if (board[c.r][c.c] === null) createItem(c.r, c.c, items[0], c.type); });
            for (let c = 0; c < width; c++) {
                let empty = 0;
                for (let r = width - 1; r >= 0; r--) {
                    if (board[r][c] === null) empty++;
                    else if (empty > 0) { const i = board[r][c]; board[r+empty][c] = i; board[r][c] = null; i.r += empty; updateItemPos(i); }
                }
                for (let i = 0; i < empty; i++) { const newItem = addRandomItem(i, c); newItem.dom.style.top = '-40px'; setTimeout(() => updateItemPos(newItem), 50); }
            }
            await new Promise(r => setTimeout(r, 450));
        }

        function hasValidMoves() {
            for (let r = 0; r < width; r++) for (let c = 0; c < width; c++) if (board[r][c] && board[r][c].special) return true;
            for (let r = 0; r < width; r++) {
                for (let c = 0; c < width; c++) {
                    if (c < width - 1 && simulateSwapAndCheck(r, c, r, c + 1)) return true;
                    if (r < width - 1 && simulateSwapAndCheck(r, c, r + 1, c)) return true;
                }
            }
            return false;
        }

        function simulateSwapAndCheck(r1, c1, r2, c2) {
            let temp = board[r1][c1]; board[r1][c1] = board[r2][c2]; board[r2][c2] = temp;
            let hasMatch = hasMatchAt(r1, c1) || hasMatchAt(r2, c2);
            temp = board[r1][c1]; board[r1][c1] = board[r2][c2]; board[r2][c2] = temp;
            return hasMatch;
        }

        function hasMatchAt(r, c) {
            if (!board[r][c] || board[r][c].special) return false;
            let type = board[r][c].type, h=1, v=1;
            for(let i=c-1; i>=0 && board[r][i] && board[r][i].type===type && !board[r][i].special; i--) h++;
            for(let i=c+1; i<width && board[r][i] && board[r][i].type===type && !board[r][i].special; i++) h++;
            if(h>=3) return true;
            for(let i=r-1; i>=0 && board[i][c] && board[i][c].type===type && !board[i][c].special; i--) v++;
            for(let i=r+1; i<width && board[i][c] && board[i][c].type===type && !board[i][c].special; i++) v++;
            return v>=3;
        }

        async function shuffleBoard() {
            playSfx('shuffle'); triggerText("ПЕРЕМЕШИВАНИЕ", "#ffd700");
            let all = []; for(let r=0; r<width; r++) for(let c=0; c<width; c++) if(board[r][c]) all.push(board[r][c]);
            let ok = false;
            while(!ok) {
                for(let i=all.length-1; i>0; i--) { const j=Math.floor(Math.random()*(i+1)); [all[i], all[j]] = [all[j], all[i]]; }
                let idx=0; for(let r=0; r<width; r++) for(let c=0; c<width; c++) { board[r][c]=all[idx++]; board[r][c].r=r; board[r][c].c=c; }
                if(checkMatches().items.length===0 && hasValidMoves()) ok=true;
            }
            for(let r=0; r<width; r++) for(let c=0; c<width; c++) updateItemPos(board[r][c]);
            await new Promise(res => setTimeout(res, 600));
        }

        function showModal(title, text, callback) {
            isProcessing = true; modalTitle.innerText = title; modalText.innerText = text;
            modal.classList.add('active');
            modalBtn.onclick = () => { initAudio(); modal.classList.remove('active'); isProcessing = false; callback(); };
        }

        function checkLevelStatus() {
            if ((goalType === 'score' && score >= targetScore) || (goalType === 'collect' && currentCollected >= targetCount)) {
                showModal("ПОБЕДА!", "Уровень пройден!", () => { currentLevel++; startLevel(); });
            } else if (moves <= 0) {
                lives--;
                if (lives > 0) showModal("ХОДЫ КОНЧИЛИСЬ!", `Попыток: ${lives}`, startLevel);
                else showModal("КОНЕЦ ИГРЫ!", "Заново?", () => { currentLevel=1; lives=3; startLevel(); });
            }
        }

        initCanvas(); animateParticles(); startLevel();
    </script>
</body>
</html>
